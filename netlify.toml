# Next.js on Netlify — OpenNext adapter is auto-applied (do not pin @netlify/plugin-nextjs).
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Optional: enable skew protection in Netlify UI / env
  # NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Optional site env (set in Netlify UI → Environment variables):
#   CONTACT_WEBHOOK_URL
#   NEXT_PUBLIC_GSC_VERIFICATION

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
